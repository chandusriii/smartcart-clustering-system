name: Validate SmartCart project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate source syntax and dataset
        run: |
          python -m compileall -q src
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          path = Path('data/smartcart_customers.csv')
          data = pd.read_csv(path)
          assert data.shape == (2240, 22), f'Unexpected dataset shape: {data.shape}'
          assert data['Income'].isna().sum() == 24
          assert data['ID'].is_unique
          assert not data.duplicated().any()
          print('Dataset validation passed:', data.shape)
          PY
      - name: Run end-to-end segmentation pipeline
        run: python src/smartcart_customer_segmentation.py
      - name: Verify generated result tables
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          out = Path('outputs/tables')
          expected = [
              'clustering_metrics.csv',
              'representation_sensitivity_metrics.csv',
              'kmeans_seed_stability.csv',
              'k_selection_diagnostics.csv',
              'cluster_sizes.csv',
              'kmeans_cluster_mean_profile.csv',
              'kmeans_cluster_median_profile.csv',
              'agglomerative_cluster_mean_profile.csv',
              'customer_cluster_assignments.csv',
          ]
          missing = [name for name in expected if not (out / name).exists()]
          assert not missing, f'Missing generated outputs: {missing}'
          metrics = pd.read_csv(out / 'clustering_metrics.csv')
          assert len(metrics) == 2
          assignments = pd.read_csv(out / 'customer_cluster_assignments.csv')
          assert len(assignments) == 2236, f'Unexpected retained rows: {len(assignments)}'
          assert assignments['KMeans_Cluster'].nunique() == 4
          assert assignments['Agglomerative_Cluster'].nunique() == 4
          sensitivity = pd.read_csv(out / 'representation_sensitivity_metrics.csv')
          assert len(sensitivity) == 4
          print('Output validation passed; retained rows:', len(assignments))
          PY
