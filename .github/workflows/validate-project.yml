name: Validate SmartCart project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate data and source syntax
        run: |
          python -m compileall -q src
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path('data/smartcart_customers.csv')
          df = pd.read_csv(p)
          assert df.shape == (2240, 22), f'Unexpected dataset shape: {df.shape}'
          assert 'Income' in df.columns and df['Income'].isna().sum() == 24
          assert df['ID'].is_unique
          print(f'Dataset validation passed: {df.shape[0]} rows, {df.shape[1]} columns')
          PY
